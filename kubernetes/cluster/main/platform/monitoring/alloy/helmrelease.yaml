apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-alloy
  namespace: flux-system
spec:
  interval: 30m

  targetNamespace: monitoring
  chart:
    spec:
      chart: alloy
      version: "1.11.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      values:
        extraVolumes:
          - name: alloy-config
            configMap:
              name: alloy-cm
              namespace: monitoring
        extraVolumeMounts:
          - name: alloy-config
            mountPath: /etc/alloy/alloy.yaml
            subPath: alloy.yaml
            readOnly: true
