apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scraparr
  namespace: scraparr
spec:
  interval: 30m
  releaseName: scraparr

  targetNamespace: scraparr
  chart:
    spec:
      chart: scraparr
      version: "1.4.0"
      sourceRef:
        kind: HelmRepository
        name: scraparr
        namespace: scraparr
  valuesFrom:
    - kind: Secret
      name: scraparr-config
