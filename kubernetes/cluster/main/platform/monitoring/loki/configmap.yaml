apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-loki-cm
  namespace: logs
data:
  values.yaml: |
    loki:
      compactor:
        working_directory: /data/retention
        compaction_interval: 1h
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 150
        delete_request_store: s3
      auth_enabled: false
      storage:
        type: s3
        s3:
          endpoint: ${LOKI_S3_ENDPOINT}
          region: ${LOKI_S3_REGION}
      schemaConfig:
        configs:
          - from: 2024-01-01
            object_store: s3
            store: tsdb
            schema: v13
            index:
              prefix: index_
              period: 24h
