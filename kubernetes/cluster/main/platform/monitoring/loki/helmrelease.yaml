apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-loki
  namespace: logs
spec:
  interval: 30m

  targetNamespace: logs
  chart:
    spec:
      chart: loki
      version: "7.1.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  valuesFrom:
    - kind: ConfigMap
      name: grafana-loki-cm
      valuesKey: values.yaml
