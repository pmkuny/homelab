apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden-secrets-manager
  namespace: external-secrets
spec:
  interval: 30m

  targetNamespace: external-secrets
  chart:
    spec:
      chart: sm-operator
      version: "2.0.3"
      sourceRef:
        kind: HelmRepository
        name: bitwarden
  valuesFrom:
    - kind: ConfigMap
      name: bitwarden-secrets-manager-config
      valuesKey: settings
